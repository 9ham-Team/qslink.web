name: QSLink CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QSL_DOMAIN: qsl.example.com
      POSTGRES_PASSWORD: ci-only-isolated-postgres-password
      QSL_DB_PASSWORD: ci-only-isolated-app-password
      QSL_TEST_DATABASE_URL: postgresql://qslink_test:ci-only-test-password@127.0.0.1:5432/qslink_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qslink_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: qslink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qslink_test -d qslink_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Run tests
        run: npm test

      - name: Verify production isolation
        run: npm run test:production

      - name: Validate production Compose config
        run: |
          docker compose -p qslink-ci config --quiet
          QSL_DOMAIN=203.0.113.1 docker compose -f compose.yaml -f compose.ip.yaml config --quiet
          QSL_APP_IMAGE=ghcr.io/example/qslink:ci-check docker compose -f compose.yaml -f compose.ghcr.yaml config --quiet
          sh -n deploy/backup.sh

      - name: Build production image
        env:
          QSL_BUILD_REVISION: ${{ github.sha }}
        run: |
          QSL_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "QSL_BUILD_CREATED=$QSL_BUILD_CREATED" >> "$GITHUB_ENV"
          docker compose -p qslink-ci build --build-arg "QSL_BUILD_REVISION=$QSL_BUILD_REVISION" --build-arg "QSL_BUILD_CREATED=$QSL_BUILD_CREATED" app

      - name: Verify container startup and production defaults
        run: |
          docker compose -p qslink-ci up -d --wait db
          printf '%s' '{"username":"ci_operator","email":"ci@example.test","password":"CI-Only-Admin-42!"}' | docker compose -p qslink-ci run --rm -T --no-deps app node server/init-admin.js
          docker compose -p qslink-ci up -d --wait app
          docker compose -p qslink-ci exec -T -e EXPECTED_REVISION="${{ github.sha }}" -e EXPECTED_CREATED="$QSL_BUILD_CREATED" -e QSL_BUILD_REVISION=spoofed -e QSL_BUILD_CREATED=spoofed app node -e "fetch('http://127.0.0.1:8787/api/config').then(async r=>{const c=await r.json();if(!r.ok||c.demo||c.demoAccounts.length||c.build?.revision!==process.env.EXPECTED_REVISION||c.build?.created!==process.env.EXPECTED_CREATED)process.exit(1)})"
          image_id=$(docker compose -p qslink-ci images -q app)
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${{ github.sha }}"
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$QSL_BUILD_CREATED"
          docker run --rm -e QSL_DOMAIN -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e QSL_DOMAIN=203.0.113.1 -v "$PWD/deploy/Caddyfile.ip:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Remove isolated CI containers and volumes
        if: always()
        run: docker compose -p qslink-ci down --volumes

  publish:
    name: Publish image to GHCR
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/dev' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and OCI labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record image build time
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push tested production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            QSL_BUILD_REVISION=${{ github.sha }}
            QSL_BUILD_CREATED=${{ steps.build-time.outputs.created }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.created }}
          cache-from: type=gha,scope=qslink-linux-amd64
          cache-to: type=gha,mode=max,scope=qslink-linux-amd64
          provenance: mode=min
          sbom: true

      - name: Summarize published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo '### Published production image'
            printf '\nImage: `%s`\n\nDigest: `%s`\n\nTags:\n\n```text\n%s\n```\n' "$IMAGE" "$DIGEST" "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
