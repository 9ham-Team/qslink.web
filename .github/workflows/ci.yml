name: QSLink CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QSL_DOMAIN: qsl.example.com
      POSTGRES_PASSWORD: ci-only-isolated-postgres-password
      QSL_DB_PASSWORD: ci-only-isolated-app-password
      QSL_TEST_DATABASE_URL: postgresql://qslink_test:ci-only-test-password@127.0.0.1:5432/qslink_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qslink_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: qslink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qslink_test -d qslink_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --omit=optional

      - name: Run tests
        run: npm test

      - name: Verify production isolation
        run: npm run test:production

      - name: Validate production Compose config
        run: docker compose -p qslink-ci config --quiet

      - name: Build production image
        run: docker compose -p qslink-ci build app

      - name: Verify container startup and production defaults
        run: |
          docker compose -p qslink-ci up -d --wait db
          printf '%s' '{"username":"ci_operator","email":"ci@example.test","password":"CI-Only-Admin-42!"}' | docker compose -p qslink-ci run --rm -T --no-deps app node server/init-admin.js
          docker compose -p qslink-ci up -d --wait app
          docker compose -p qslink-ci exec -T app node -e "fetch('http://127.0.0.1:8787/api/config').then(async r=>{const c=await r.json();if(!r.ok||c.demo||c.demoAccounts.length)process.exit(1)})"
          docker run --rm -e QSL_DOMAIN -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Remove isolated CI containers and volumes
        if: always()
        run: docker compose -p qslink-ci down --volumes
